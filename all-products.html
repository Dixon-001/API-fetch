<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { primary: "#4f46e5", secondary: "#f97316", accent: "#ffa22f" },
            fontFamily: { sans: ["Inter", "system-ui", "sans-serif"], brand: ["Pacifico", "cursive"] },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" />
    <style>
      body { font-family: "Inter", system-ui, sans-serif; }
      .hero { background-image: url("images/black-friday-elements-assortment.jpg"); background-size: cover; background-position: center right; }
    </style>
  </head>
  <body class="min-h-screen bg-white text-gray-900 antialiased">
    <header class="sticky top-0 z-50 bg-gray-100 shadow-sm">
      <div class="container mx-auto flex items-center justify-between gap-2 px-4 py-3 sm:px-6 lg:px-8">
        <a href="index.html" class="font-brand text-2xl text-primary">DNG</a>
        <nav class="hidden items-center space-x-8 md:flex"><a href="#" class="font-medium text-gray-900 transition-colors hover:text-primary">All products</a>
         
        </nav>
        <div class="flex items-center gap-1 sm:gap-3">
          <div class="relative">
           <div class="mx-auto mb-1 flex max-w-xl items-center gap-2">
                <div class="relative flex-1">
                    <i class="ri-search-line pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="freshSearchInput" placeholder="Search for products..."
                        class="w-full rounded-lg border border-gray-200 py-3 pl-11 pr-4 text-sm focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20" />
                </div>
               
            </div>
          </div>
          <div class="group relative">
            <button class="flex h-10 w-10 items-center justify-center text-gray-700 transition-colors hover:text-primary" aria-label="Account"><i class="ri-user-line text-xl"></i></button>
            <div class="absolute right-0 hidden w-44 pt-2 group-hover:block group-focus-within:block">
              <div class="rounded bg-white py-1 shadow-lg">
                <a href="login.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Sign In</a>
                <a href="registration.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Register</a>
                <a href="dashboard.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">My Account</a>
                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Orders</a>
              </div>
            </div>
          </div>
          <div class="relative">
            <button id="cartToggle" class="relative flex h-10 w-10 items-center justify-center text-gray-700 transition-colors hover:text-primary" aria-label="Cart">
              <i class="ri-shopping-bag-line text-xl"></i>
              <span class="absolute -right-1 -top-1 flex h-5 w-5 items-center justify-center rounded-full bg-primary text-xs text-white">3</span>
            </button>
            <div id="cartDropdown" class="fixed inset-x-4 top-[68px] z-50 hidden rounded-lg bg-white p-4 shadow-lg sm:absolute sm:inset-x-auto sm:right-0 sm:top-full sm:mt-2 sm:w-80">
              <h3 class="mb-3 font-medium text-gray-900">Your Cart (3)</h3>
              <div class="max-h-72 space-y-3 overflow-y-auto">
                <div class="flex items-center gap-3">
                  <img src="images/white t-shirt.webp" alt="Essential White T-Shirt" class="h-16 w-16 rounded object-cover" />
                  <div class="min-w-0 flex-1">
                    <h4 class="truncate text-sm font-medium">Essential White T-Shirt</h4>
                    <p class="text-xs text-gray-500">Size: M | Qty: 1</p>
                    <p class="text-sm font-medium">NGN2,400.99</p>
                  </div>
                  <button class="text-gray-400 hover:text-gray-600" aria-label="Remove"><i class="ri-close-line"></i></button>
                </div>
                <div class="flex items-center gap-3">
                  <img src="images/denim jeans.webp" alt="Slim Fit Black Jeans" class="h-16 w-16 rounded object-cover" />
                  <div class="min-w-0 flex-1">
                    <h4 class="truncate text-sm font-medium">Slim Fit Black Jeans</h4>
                    <p class="text-xs text-gray-500">Size: 32 | Qty: 1</p>
                    <p class="text-sm font-medium">NGN59,000.99</p>
                  </div>
                  <button class="text-gray-400 hover:text-gray-600" aria-label="Remove"><i class="ri-close-line"></i></button>
                </div>
                <div class="flex items-center gap-3">
                  <img src="images/leather watch.webp" alt="Classic Leather Watch" class="h-16 w-16 rounded object-cover" />
                  <div class="min-w-0 flex-1">
                    <h4 class="truncate text-sm font-medium">Classic Leather Watch</h4>
                    <p class="text-xs text-gray-500">Color: Brown | Qty: 1</p>
                    <p class="text-sm font-medium">NGN12,900.99</p>
                  </div>
                  <button class="text-gray-400 hover:text-gray-600" aria-label="Remove"><i class="ri-close-line"></i></button>
                </div>
              </div>
              <div class="mt-4 border-t border-gray-100 pt-3">
                <div class="mb-3 flex justify-between"><span class="text-sm text-gray-600">Subtotal</span><span class="text-sm font-medium">NGN214,000.97</span></div>
                <div class="space-y-2">
                  <a href="#" class="block w-full rounded-lg bg-primary px-4 py-2 text-center font-medium text-white transition-colors hover:bg-primary/90">Checkout</a>
                  <a href="#" class="block w-full rounded-lg bg-gray-100 px-4 py-2 text-center font-medium text-gray-800 transition-colors hover:bg-gray-200">View Cart</a>
                </div>
              </div>
            </div>
          </div>
          <button id="menuToggle" class="flex h-10 w-10 items-center justify-center text-gray-700 md:hidden" aria-label="Menu"><i class="ri-menu-line text-2xl"></i></button>
        </div>
      </div>
      <div id="mobileMenu" class="hidden border-t border-gray-200 bg-gray-100 md:hidden">
        <div class="container mx-auto space-y-1 px-4 py-3 sm:px-6">
          <a href="#" class="block py-2 font-medium text-gray-900">New Products</a>
         
      </div>
    </header>

    <section id="searchSection" class="bg-gray-50">
       <div class="pl-5">
         <select id="sortSelect" class="h-8 w-fit border border-blue-400 rounded-md  ">
            <option value="">Sort by</option>
            <option value="price-asc">Price: Low - High</option>
            <option value="price-desc">Price: High - Low</option>
            <option value="name-asc">Name: A - Z</option>
            <option value="name-desc">Name: Z - A</option>
        </select>
       </div>
        <div id="searchResults" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4  bg-gray-50 pl-5">
        
        </div>   
        <div class="container mx-auto px-4 sm:px-6 lg:px-8 bg-gray-50">
            <!-- container -->   
        </div>
    </section>
        </div>   
    
    <div id="products" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4 bg-gray-50 stticky"></div>
    <button style="background-color: blue; color: white; border: none; padding: 10px 20px; margin: 20px; cursor: pointer; border-radius: 5px;">
        <a href="index.html" style="text-decoration: none; color: white;">Back to Home</a>
    </button>

   <script>
    let allProducts = [];
    const container = document.getElementById("products");
    const searchResults = document.getElementById("searchResults");
    const searchInput = document.getElementById("freshSearchInput");

    async function getData() {
    try {
        const res = await fetch("https://dummyjson.com/products?limit=194");
        const result = await res.json();
        allProducts = result.products;

        allProducts.forEach((product) => {
        const div = document.createElement("div");
        div.style.border = "3px solid gray";
        div.style.borderRadius = "10px";
        div.style.margin = "20px";
        div.style.fontSize = "16px";
        div.style.padding = "10px";
        div.style.fontFamily = "'Inter', sans-serif";

        div.innerHTML = `
            <p>${product.category}</p>
            <img src="${product.thumbnail}" width="300px" height="250px">
            <h3>${product.title}</h3>
            <p class="font-medium text-gray-900">NGN ${(product.price * 160).toLocaleString()}</p>
        `;
        container.appendChild(div);
        });
    } catch (error) {
        console.error(error.message);
    }
    }
    getData();

    searchInput.addEventListener("input", () => {
    const keyword = searchInput.value.trim().toLowerCase();

    if (!keyword) {
        
        searchResults.innerHTML = "";
        searchResults.classList.add("hidden");
        container.classList.remove("hidden");
        return;
    }

   
    container.classList.add("hidden");
    searchResults.classList.remove("hidden");

    const matches = allProducts.filter(p =>
        p.title.toLowerCase().includes(keyword) ||
        p.category.toLowerCase().includes(keyword) ||
        p.description.toLowerCase().includes(keyword)
    );

    searchResults.innerHTML = "";

    if (!matches.length) {
        searchResults.innerHTML = `<p class="col-span-full text-center text-gray-500">No products found for "${keyword}".</p>`;
        return;
    }

    matches.forEach(product => {
        const card = document.createElement("article");
        card.className = "group";
        card.style.border ="3px solid gray"
        card.style.borderRadius = "16px"
        card.style.padding ="10px"
        card.innerHTML = `
         <h3 class="mb-1 font-medium text-gray-900">${product.category}</h3>
        <div class="relative mb-4 overflow-hidden rounded-lg bg-gray-100">
            <img src="${product.thumbnail}" alt="${product.title}"
                class="h-72 w-"180px" object-contain transition-transform duration-500 group-hover:scale-105"
                loading="lazy" />
        </div>
        <h3 class="mb-1 font-medium text-gray-900">${product.title}</h3>
        <div class="flex items-center">
            <p class="font-medium text-gray-900">₦${(product.price * 160).toLocaleString()}</p>
        </div>
        `;
        searchResults.appendChild(card);
    });
    });   

            
   </script>

    
</body>
</html>
