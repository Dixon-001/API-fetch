<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="./output.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans min-h-screen p-6">

    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Pokémon Gallery</h1>

        <div id="pokemon" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </div>

    <script>
        let pokemonContainer = document.getElementById("pokemon");

        let names = ["ivysaur", "charmeleon", "wartortle", "metapod", "kakuna", "pidgeotto", "raticate"];

        function getPokemon() {
            let requests = names.map((name) => {
                return fetch(`https://pokeapi.co/api/v2/pokemon/${name}`).then((response) => response.json());
            });

            Promise.all(requests)
                .then((data) => {
                    data.forEach((item) => {
                        let card = document.createElement("div");
                        card.className = "bg-white rounded-xl shadow-md overflow-hidden p-5 flex flex-col items-center hover:shadow-lg transition-shadow duration-300 border border-gray-100";
                        
                        let types = item.types.map((t) => 
                            `<span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded capitalize">${t.type.name}</span>`
                        ).join(" ");

                        let abilities = item.abilities.map((a) => 
                            `<span class="bg-gray-100 text-gray-700 text-xs px-2 py-0.5 rounded capitalize">${a.ability.name}</span>`
                        ).join(" ");

                        card.innerHTML = `
                            <span class="text-xs font-bold text-gray-400 self-end">#${String(item.id).padStart(3, '0')}</span>
                            <img class="w-28 h-28 object-contain my-2 bg-gray-50 rounded-full p-2" src="${item.sprites.front_default}" alt="${item.name}">
                            <h2 class="text-xl font-bold capitalize text-gray-800 mb-2">${item.name}</h2>
                            
                            <div class="flex gap-1 mb-4">
                                ${types}
                            </div>

                            <div class="w-full text-sm text-gray-600 space-y-1 pt-3 border-t border-gray-100">
                                <div class="flex justify-between">
                                    <span class="text-gray-400">Height:</span>
                                    <span class="font-medium">${item.height / 10} m</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-400">Weight:</span>
                                    <span class="font-medium">${item.weight / 10} kg</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-400">Base Exp:</span>
                                    <span class="font-medium">${item.base_experience}</span>
                                </div>
                                <div class="mt-2">
                                    <span class="text-gray-400 block text-xs mb-1">Abilities:</span>
                                    <div class="flex flex-wrap gap-1">
                                        ${abilities}
                                    </div>
                                </div>
                            </div>
                        `;
                        pokemonContainer.appendChild(card);
                    });
                })
                .catch((error) => {
                    console.error("something went wrong:", error);
                });
        }

        getPokemon();
    </script>
</body>
</html>
