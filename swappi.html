<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swappi API</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
   
   <section class="py-12 md:py-16 bg-gray-100">
        <div class="container mx-auto border-2 border-gray-300 p-4 rounded-lg shadow-md">
            <h2 class="text-3xl font-bold text-center mb-4">Swappi API/people</h2>
            <div id="people" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
            </div>
        </div>
            <!-- planets  -->
         <div class="container mx-auto border-2 border-gray-300 p-4 rounded-lg shadow-md">
            <h2 class="text-3xl font-bold text-center mb-4">Swappi API/planets</h2>
            <div id="planets" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
            </div>
        </div>

        <!-- films  -->
        <div class="container mx-auto border-2 border-gray-300 p-4 rounded-lg shadow-md">
            <h2 class="text-3xl font-bold text-center mb-4">Swappi API/films</h2>
            <div id="films" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 gap-4">
        </div>
        <!-- species  -->
        <div class="container mx-auto border-2 border-gray-300 p-4 rounded-lg shadow-md">
            <h2 class="text-3xl font-bold text-center mb-4">Swappi API/species</h2>
            <div id="species" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
            </div>
        </div>
        <!-- vehicles -->
         <div class="container mx-auto border-2 border-gray-300 p-4 rounded-lg shadow-md">
            <h2 class="text-3xl font-bold text-center mb-4">Swappi API/Vehicles</h2>
            <div id="vehicles" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
            </div>
        </div>
        <!-- starship  -->
          <div class="container mx-auto border-2 border-gray-300 p-4 rounded-lg shadow-md">
            <h2 class="text-3xl font-bold text-center mb-4">Swappi API/starship</h2>
            <div id="starship" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            </div>
        </div>
    </section>
    <script>
        async function fetchPeople() {
            try {
                const response = await fetch('https://swapi.dev/api/people/');
                const data = await response.json();
                // console.log(data);
                const peopleDiv = document.getElementById('people');
                peopleDiv.innerHTML = '';
                data.results.forEach(person => {
                    // console.log(person);
                    const personCard = document.createElement('div');
                    personCard.style.fontFamily = 'poppins, sans-serif';
                    personCard.style.border= '1px solid #ccc';
                    personCard.style.borderRadius = '18px';
                    // personCard.style.width = '300px';
                     personCard.style.padding = '16px';

                    personCard.innerHTML = `
                        <h3 class="text-xl font-bold mb-2">${person.name}</h3>
                        <p><strong>Height:</strong> ${person.height} cm</p>
                        <p><strong>Mass:</strong> ${person.mass} kg</p>
                        <p><strong>Hair Color:</strong> ${person.hair_color}</p>
                        <p><strong>Skin Color:</strong> ${person.skin_color}</p>
                        <p><strong>Eye Color:</strong> ${person.eye_color}</p>
                        <p><strong>Birth Year:</strong> ${person.birth_year}</p>
                        <p><strong>Gender:</strong> ${person.gender}</p>
                    `;
                    peopleDiv.appendChild(personCard);
                });
            } catch (error) {
                console.error('Error fetching people:', error);
            }
        }

        fetchPeople();
        //  planets 
          async function fetchPlanets() {
            try {
                const response = await fetch('https://swapi.dev/api/planets/');
                const data = await response.json();
                // console.log(data);
                const planetsDiv = document.getElementById('planets');
                planetsDiv.innerHTML = '';
                data.results.forEach(planets => {
                    // console.log(planets);
                    const planetCard = document.createElement('div');
                    planetCard.style.fontFamily = 'poppins, sans-serif';
                    planetCard.style.border= '1px solid #ccc';
                    planetCard.style.borderRadius = '18px';
                    // planetCard.style.width = '300px';
                     planetCard.style.padding = '16px';

                    planetCard.innerHTML = `
                        <h3 class="text-xl font-bold mb-2">${planets.name}</h3>
                        <p><strong>Rotation Period:</strong> ${planets.rotation_period}</p>
                        <p><strong>Orbital Period:</strong> ${planets.orbital_period}</p>
                        <p><strong>Diameter:</strong> ${planets.diameter} km</p>
                        <p><strong>Climate:</strong> ${planets.climate}</p>
                        <p><strong>Gravity:</strong> ${planets.gravity}</p>
                        <p><strong>Surface Water:</strong> ${planets.surface_water}</p>
                        <p><strong>Population:</strong> ${planets.population}</p>           
                    `;
                    planetsDiv.appendChild(planetCard);
                });
            } catch (error) {
                console.error('Error fetching planets:', error);
            }
        }
            // films 
             async function fetchFilms() {
            try {
                const response = await fetch('https://swapi.dev/api/films/');
                const data = await response.json();
                // console.log(data);
                const filmsDiv = document.getElementById('films');
                // filmsDiv.innerHTML = '';
                data.results.forEach(film => {
                    // console.log(film);
                    const filmCard = document.createElement('div');
                    filmCard.style.fontFamily = 'poppins, sans-serif';
                    filmCard.style.border= '1px solid #ccc';
                    filmCard.style.borderRadius = '18px';
                    // filmCard.style.width = '300px';
                     filmCard.style.padding = '16px';

                    filmCard.innerHTML = `
                        <h3 class="text-xl font-bold mb-2">${film.title}</h3>
                        <p><strong>Episode:</strong> ${film.episode_id}</p>
                        <p><strong>Release Date:</strong> ${film.release_date}</p>
                        <p><strong>Director:</strong> ${film.director}</p>
                        <p><strong>Producer:</strong> ${film.producer}</p>
                        
                    
                        
                    `;
                    filmsDiv.appendChild(filmCard);
                });
            } catch (error) {
                console.error('Error fetching films:', error);
            }
        }
        //    species 
         async function fetchspecies() {
            try {
                const response = await fetch('https://swapi.dev/api/species/');
                const data = await response.json();
                // console.log(data);
                const speciesDiv = document.getElementById('species');

                    // console.log(species);
                    const speciesCard = document.createElement('div');

                    // personCard.style.width = '300px';

                    speciesCard.innerHTML = `
                        <h3 class="text-xl font-bold mb-2">${species.name}</h3>
                        <p><strong>Average Lifespan:</strong> ${species.average_lifespan} </p>

                        <p><strong>Eyes colors</strong> ${species.eye_colors} </p>
                       <p><strong>Hair colors:</strong> ${species.hair_colors} </p>
                        <p><strong>Skin color:</strong> ${species.skin_colors} </p>
                        <p><strong>Language:</strong> ${species.language} </p>
                    
                       
                       
                    `;
                    speciesDiv.appendChild(speciesCard);
                });
            } catch (error) {
                console.error('Error fetching people:', error);
            }
        }
        // vehicles 
         async function fetchvehicles() {
            try {
                const response = await fetch('https://swapi.dev/api/vehicles/');
                const data = await response.json();
                console.log(data);
                const vehiclesDiv = document.getElementById('vehicles');
                vehiclesDiv.innerHTML = '';
                data.results.forEach(vehicles => {
                    // console.log(vehicles);
                    const vehiclesCard = document.createElement('div');
                    vehiclesCard.style.fontFamily = 'poppins, sans-serif';
                    vehiclesCard.style.border= '1px solid #ccc';
                    vehiclesCard.style.borderRadius = '18px';
                    // personCard.style.width = '300px';
                     vehiclesCard.style.padding = '16px';

                    vehiclesCard.innerHTML = `
                        <h3 class="text-xl font-bold mb-2">${vehicles.name}</h3>
                        <p><strong>Model:</strong> ${vehicles.model}</p>
                        <p><strong>Manufacturer:</strong> ${vehicles.manufacturer}</p>
                        <p><strong>Cost un Credit:</strong> ${vehicles.cost_in_credits}</p>
                        <p><strong>vehicle length:</strong> ${vehicles.length}</p>
                        <p><strong>Max atm speed:</strong> ${vehicles.max_atmosphering_speed}</p>
                        <p><strong>vehicles crew:</strong> ${vehicles.crew}</p>
                        <p><strong>Passengers:</strong> ${vehicles.passengers}</p>
                         <p><strong>Cargo capacity:</strong> ${vehicles.cargo_capacityl}</p>
                        <p><strong>Consumables:</strong> ${vehicles.consumables}</p>
                        <p><strong>vehicle class:</strong> ${vehicles.vehicle_class}</p>
                       
                    `;
                    vehiclesDiv.appendChild(vehiclesCard);
                });
            } catch (error) {
                console.error('Error fetching people:', error);
            }
        }
        // starships 
          async function fetchstarship() {
            try {
                const response = await fetch('https://swapi.dev/api/starships/');
                const data = await response.json();
                console.log(data);
                const starshipDiv = document.getElementById('starship');
                starshipDiv.innerHTML = '';
                data.results.forEach(starship => {
                    // console.log(starship);
                    const starshipCard = document.createElement('div');
                    starshipCard.style.fontFamily = 'poppins, sans-serif';
                    
                    starshipCard.style.border= '1px solid #ccc';
                    // personCard.style.width = '300px';
                     starshipCard.style.padding = '16px';
                     starshipCard.style.borderRadius = '16px'
                    starshipCard.innerHTML = `
                        <h3 class="text-xl font-bold mb-2">${starship.name}</h3>
                        <p><strong>Model:</strong> ${starship.model}</p>
                        <p><strong>Manufacturer:</strong> ${starship.manufacturer}</p>
                        <p><strong>Cost in Credit:</strong> ${starship.cost_in_credits}</p>
                        <p><strong>vehicle length:</strong> ${starship.length}</p>
                        <p><strong>Max atm speed:</strong> ${starship.max_atmosphering_speed}</p>
                        <p><strong>starship crew:</strong> ${starship.crew}</p>
                        <p><strong>Passengers:</strong> ${starship.passengers}</p>
                         <p><strong>Cargo capacity:</strong> ${starship.cargo_capacity}</p>
                        <p><strong>Consumables:</strong> ${starship.consumables}</p>
                         <p><strong>Hydrating Rating:</strong> ${starship.hyperdrive_rating}</p>
                        <p><strong>MGLT:</strong> ${starship.MGLT}</p>
                        <p><strong>Starship class:</strong> ${starship.starship_class}</p>
                       
                    `;
                    starshipDiv.appendChild(starshipCard);
                });
            } catch (error) {
                console.error('Error fetching people:', error);
            }
        }
        fetchstarship()
        fetchvehicles()
        fetchspecies()
        fetchPlanets();
        fetchFilms();
    </script>
</body>
</html>
